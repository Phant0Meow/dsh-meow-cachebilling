# meow-cachebilling 价目表（元 / 百万 token）
#
# 手填指南：
#   model       写 API 实际返回的模型名（匹配=先精确、再后缀，大小写不敏感）
#   provider    可选：填了则只对该路由生效（与 API 返回的 provider 串一致）；不填 = 该模型所有路由通用
#   timezone    计费方账单时区（IANA 名，如 Asia/Shanghai / America/New_York），缺省 Asia/Shanghai
#   计价形态三选一：
#     peak + valley   峰谷价：when = days × ranges 叉乘（days=星期缩写，支持 mon-fri 区间；
#                     ranges="HH:MM-HH:MM"，start 含、end 不含，支持 24:00，不支持跨天——要跨请拆两条）；
#                     valley 不写 when，自动取 peak 的补集（含周末全天谷，取决于 peak 覆盖了哪几天）
#     const           一口价：24 小时同一价
#   write       可选：缓存写入单价，缺省 = miss（官方 API 不单独报写入价）
#   cacheSaving 服务器缓存保留时长，实测后回填，现在没有逻辑
#
# 改完重启 dsh web 生效。条目非法会被跳过（控制台有警告），文件整体损坏则回退内置默认表——不会弄崩 DSH。

models:
  # ── DeepSeek（2026-09-25 核对 api-docs.deepseek.com/zh-cn/quick_start/pricing）──
  # 高峰=北京时间周一至五 9:00-12:00、14:00-18:00，闲时=高峰减半、周末全天谷。
  # 主力条目：V4.1-Flash（9 月中旬上线，旧 deepseek-v4-flash 名已下线、旧调用
  # 仍由 Flash 按 Flash 价服务——旧名条目随行保留，账不断）。
  - model: deepseek-v4.1-flash
    provider: deepseek-official
    timezone: Asia/Shanghai
    peak:
      hit: 0.04
      miss: 2
      output: 8
      when:
        - days: [mon, tue, wed, thu, fri]
          ranges: ["09:00-12:00", "14:00-18:00"]
    valley:
      hit: 0.02
      miss: 1
      output: 4
    cacheSaving: null

  - model: deepseek-v4-flash
    provider: deepseek-official
    timezone: Asia/Shanghai
    peak:
      hit: 0.04
      miss: 2
      output: 8
      when:
        - days: [mon, tue, wed, thu, fri]
          ranges: ["09:00-12:00", "14:00-18:00"]
    valley:
      hit: 0.02
      miss: 1
      output: 4
    cacheSaving: null

  # 旧视觉变体：V4.1-Flash 原生带视觉后疑似退役；条目闲置无害，留作老路由兜底
  - model: deepseek-v4-flash-vision-exp
    provider: deepseek-official
    timezone: Asia/Shanghai
    peak:
      hit: 0.04
      miss: 2
      output: 8
      when:
        - days: [mon, tue, wed, thu, fri]
          ranges: ["09:00-12:00", "14:00-18:00"]
    valley:
      hit: 0.02
      miss: 1
      output: 4
    cacheSaving: null

  - model: deepseek-v4-pro
    provider: deepseek-official
    timezone: Asia/Shanghai
    peak:
      hit: 0.3
      miss: 9
      output: 27
      when:
        - days: [mon, tue, wed, thu, fri]
          ranges: ["09:00-12:00", "14:00-18:00"]
    valley:
      hit: 0.15
      miss: 4.5
      output: 13.5
    cacheSaving: null

  # pro 的 0813 版本号别名：API 若回报全名（deepseek-v4-pro-0813），精确匹配用它
  - model: deepseek-v4-pro-0813
    provider: deepseek-official
    timezone: Asia/Shanghai
    peak:
      hit: 0.3
      miss: 9
      output: 27
      when:
        - days: [mon, tue, wed, thu, fri]
          ranges: ["09:00-12:00", "14:00-18:00"]
    valley:
      hit: 0.15
      miss: 4.5
      output: 13.5
    cacheSaving: null

  # ── 智谱 GLM（2026-09-25 核对 open.bigmodel.cn/pricing；一口价，无峰谷）──
  # 5.3 / 5.2：缓存命中已恢复收费 2 元（曾经的命中限时免费已结束）
  - model: glm-5.3
    provider: zai-coding-cn
    timezone: Asia/Shanghai
    const:
      hit: 2
      miss: 8
      output: 28
    cacheSaving: null

  - model: glm-5.2
    provider: zai-coding-cn
    timezone: Asia/Shanghai
    const:
      hit: 2
      miss: 8
      output: 28
    cacheSaving: null

  # glm-5.3-flash：五折（0.115/0.4/1.4）已到期，回标准价；
  # 官方若复活五折，改回 hit 0.115 / miss 0.4 / output 1.4
  - model: glm-5.3-flash
    provider: zai-coding-cn
    timezone: Asia/Shanghai
    const:
      hit: 0.23
      miss: 0.8
      output: 2.8
    cacheSaving: null
